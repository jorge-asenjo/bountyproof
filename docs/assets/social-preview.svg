  <text x="100" y="306" class="sans" font-size="44" fill="#c9d1d9">They hunt. They prove it. You get paid.</text>
  <text x="100" y="356" class="sans" font-size="26" fill="#8b98a9">A team of AI agents for bug bounties. You approve the scope and press submit.</text>

