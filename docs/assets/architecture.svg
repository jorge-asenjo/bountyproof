<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
  <title id="t">How bountyproof works</title>
  <desc id="d">Program rules feed an orchestrator, which shards work to read-only discoverers. A separate validator tests candidates, an independent evidence judge decides what is reportable, and a human submits. A shared case file holds the evidence; a scope-guard hook checks every request.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8a9c"/>
    </marker>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .h { font-size: 17px; font-weight: 700; fill: #e6edf3; }
      .b { font-size: 13px; fill: #a9b4c2; }
      .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="519" rx="18" fill="#0f141c" stroke="#263040"/>

  <text x="40" y="50" class="sans" font-size="22" font-weight="700" fill="#e6edf3">How bountyproof works</text>
  <text x="40" y="76" class="sans" font-size="14" fill="#8b98a9">Every finding is false until an independent judge sees the artifact that separates "vulnerable" from "benign".</text>

  <!-- 1. Program -->
  <rect x="40" y="110" width="160" height="140" rx="12" fill="#18202b" stroke="#3a4658" stroke-width="1.5"/>
  <text x="60" y="140" class="sans tag" fill="#8b98a9">INPUT</text>
  <text x="60" y="164" class="sans h">Program</text>
  <text x="60" y="190" class="sans b">rules + scope</text>
  <text x="60" y="210" class="sans b">threat model</text>
  <text x="60" y="230" class="mono b">→ scope.json</text>

  <!-- 2. Orchestrator -->
  <rect x="232" y="110" width="160" height="140" rx="12" fill="#13213a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="252" y="140" class="sans tag" fill="#6ea8ff">PLAN</text>
  <text x="252" y="164" class="sans h">Orchestrator</text>
  <text x="252" y="190" class="sans b">shards the surface</text>
  <text x="252" y="210" class="sans b">owns the case file</text>
  <text x="252" y="230" class="sans b">runs the gates</text>

  <!-- 3. Discoverers -->
  <rect x="424" y="110" width="160" height="140" rx="12" fill="#13213a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="444" y="140" class="sans tag" fill="#6ea8ff">READ-ONLY</text>
  <rect x="440" y="152" width="128" height="26" rx="6" fill="#1b2d4d" stroke="#2f5da8"/>
  <text x="452" y="170" class="sans b" fill="#c9d6ea">discoverer · shard A</text>
  <rect x="440" y="184" width="128" height="26" rx="6" fill="#1b2d4d" stroke="#2f5da8"/>
  <text x="452" y="202" class="sans b" fill="#c9d6ea">discoverer · shard B</text>
  <rect x="440" y="216" width="128" height="26" rx="6" fill="#1b2d4d" stroke="#2f5da8"/>
  <text x="452" y="234" class="sans b" fill="#c9d6ea">discoverer · shard C</text>

  <!-- 4. Validator -->
  <rect x="616" y="110" width="160" height="140" rx="12" fill="#13213a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="636" y="140" class="sans tag" fill="#6ea8ff">VALIDATE</text>
  <text x="636" y="164" class="sans h">Validator</text>
  <text x="636" y="190" class="sans b">separate role</text>
  <text x="636" y="210" class="sans b">negative control first</text>
  <text x="636" y="230" class="sans b">own accounts only</text>

  <!-- 5. Judge -->
  <rect x="808" y="110" width="160" height="140" rx="12" fill="#2a1a12" stroke="#d97757" stroke-width="2"/>
  <text x="828" y="140" class="sans tag" fill="#f0a07f">GATE</text>
  <text x="828" y="164" class="sans h">Evidence judge</text>
  <text x="828" y="190" class="sans b">exploit conditions</text>
  <text x="828" y="210" class="sans b">benign alternative</text>
  <text x="828" y="230" class="sans b">discriminating artifact</text>

  <!-- 6. Report + human -->
  <rect x="1000" y="110" width="160" height="140" rx="12" fill="#11261a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="1020" y="140" class="sans tag" fill="#5fd38a">REPORT</text>
  <text x="1020" y="164" class="sans h">Human submits</text>
  <text x="1020" y="190" class="sans b">v1 from facts</text>
  <text x="1020" y="210" class="sans b">v2 clarity pass</text>
  <text x="1020" y="230" class="sans b">review verdict</text>

  <!-- flow arrows -->
  <g stroke="#7d8a9c" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="202" y1="180" x2="228" y2="180"/>
    <line x1="394" y1="180" x2="420" y2="180"/>
    <line x1="586" y1="180" x2="612" y2="180"/>
    <line x1="778" y1="180" x2="804" y2="180"/>
    <line x1="970" y1="180" x2="996" y2="180"/>
  </g>

  <!-- case file band -->
  <g stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="312" y1="250" x2="312" y2="298"/>
    <line x1="504" y1="250" x2="504" y2="298"/>
    <line x1="696" y1="250" x2="696" y2="298"/>
    <line x1="888" y1="250" x2="888" y2="298"/>
  </g>
  <rect x="232" y="298" width="736" height="50" rx="10" fill="#151b24" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="600" y="329" class="mono" font-size="13" fill="#c9d1d9" text-anchor="middle">notes/case-file.md · shared memory: facts, hypotheses, dossiers, verdicts</text>

  <!-- scope guard band -->
  <rect x="40" y="372" width="1120" height="74" rx="12" fill="#1d1216" stroke="#b4454f" stroke-width="1.5"/>
  <text x="64" y="402" class="sans" font-size="15" font-weight="700" fill="#ff8f96">scope-guard hook</text>
  <text x="212" y="402" class="sans" font-size="14" fill="#c9b4b7">runs before every Bash / PowerShell command and every browser navigation, from notes/scope.json</text>
  <text x="64" y="430" class="mono" font-size="13" fill="#e8c7ca">out of scope → deny  ·  missing UA tag → deny  ·  unknown host → deny  ·  scope changed → re-confirm  ·  every request → egress log</text>

  <text x="600" y="490" class="sans" font-size="14" fill="#8b98a9" text-anchor="middle">Discovery never confirms itself. The judge never found the bug. The agent never submits.</text>
</svg>
